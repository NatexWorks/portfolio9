name: Portfolio checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        id: dependencies
        run: |
          if node -e 'const fs = require("node:fs"); const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8")); if (lock.lockfileVersion < 1) process.exit(1)' >/dev/null 2>&1; then
            echo "Committed npm lockfile is valid."
          else
            echo "Committed npm lockfile is invalid; regenerating it from package.json."
            rm -f package-lock.json
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          node -e 'const lock = require("./package-lock.json"); console.log("Using package-lock version:", lock.lockfileVersion)'
          npm ci --package-lock=true
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      - name: Install browser QA tooling
        run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/natexworks-next.log 2>&1 &
          echo $! > /tmp/natexworks-next.pid
          node -e 'const until = Date.now() + 90000; const tick = async () => { try { const r = await fetch("http://127.0.0.1:3000"); if (r.ok) process.exit(0); } catch {} if (Date.now() > until) { console.error("Next.js server did not become ready"); process.exit(1); } setTimeout(tick, 1000); }; tick();'
      - name: Run responsive, accessibility, and full click coverage
        run: npm run test:browser
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-qa
          path: artifacts/browser-qa/
          if-no-files-found: ignore
      - name: Commit regenerated npm lockfile
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Repair invalid npm lockfile"
            git push
          fi
